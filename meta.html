<script>
  /* The postcards trestles template hardcodes <img src="..."> with no alt
     slot, so set it here for screen readers. */
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('img.rounded').forEach(function (img) {
      if (!img.getAttribute('alt')) img.setAttribute('alt', 'Resuf Ahmed');
    });
  });
</script>
